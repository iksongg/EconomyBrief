<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이코노미브리프 - 내 용어장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="design-system/tokens/colors.css" />
<link rel="stylesheet" href="design-system/tokens/typography.css" />
<link rel="stylesheet" href="design-system/tokens/layout.css" />
<link rel="stylesheet" href="assets/css/common.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family-base);
    background: #EAEBEF;
    min-height: 100dvh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .scroll-area { padding-bottom: 20px; }

  .section-white { background: #ffffff; padding: 20px; }

  .hero-card { background: #F8F8FC; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 12px; }
  .hero-card .hero-icon { width: 72px; height: 72px; border-radius: 36px; background: #B5CBFD; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  .hero-card .hero-icon img { width: 53px; height: 47.247px; object-fit: contain; }
  .hero-card .hero-text { display: flex; flex-direction: column; gap: 5px; }
  .hero-card .hero-label { font-weight: var(--font-weight-medium); font-size: 12px; color: #000; }
  .hero-card .hero-count { font-weight: var(--font-weight-semibold); font-size: 24px; color: #000; }
  .hero-card .hero-sub { font-weight: var(--font-weight-regular); font-size: 14px; color: #5B5E73; margin-top: 2px; }

  .filter-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--color-border-default); }
  .filter-row .filter-item { display: flex; align-items: center; gap: 4px; font-size: 14px; color: #000; background: none; border: none; font-family: inherit; cursor: pointer; }
  .filter-row .filter-item .gicon { font-size: 18px; width: 18px; height: 18px; color: #000; }

  .term-list { display: flex; flex-direction: column; }
  .term-item { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--color-border-default); gap: 12px; }
  .term-item:last-child { border-bottom: none; }
  .term-info { display: flex; flex-direction: column; gap: 12px; width: 246px; }
  .term-info .term-name { font-weight: var(--font-weight-semibold); font-size: 14px; color: #000; line-height: 1.3; }
  .term-info .term-def { font-weight: var(--font-weight-regular); font-size: 14px; color: #000; line-height: 1.6; margin-top: 4px; }
  .term-meta { display: flex; align-items: center; gap: 4px; }
  .term-meta .term-tag { background: #F3F2FE; border-radius: 999px; padding: 4px 10px; font-size: 10px; color: #6140E9; }
  .term-meta .term-date { font-size: 10px; color: #5B5E73; }
  .term-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .term-actions .bookmark-btn { background: none; border: none; padding: 0; cursor: pointer; display: block; }
  .term-actions .bookmark-btn .gicon { font-size: 18px; width: 18px; height: 18px; color: var(--color-brand-600); font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  .term-actions .delete-btn {
    display: none; width: 20px; height: 20px; border-radius: 50%; background: #EF4444; border: none;
    color: #fff; font-size: 13px; line-height: 1; cursor: pointer; align-items: center; justify-content: center;
  }
  .term-list.editing .delete-btn { display: flex; }
  .term-list.editing .bookmark-btn { display: none; }

  .empty-state { padding: 40px 0; text-align: center; color: #5B5E73; font-size: 14px; }
</style>
</head>
<body>

<div class="device">
  <div class="scroll-area">

    <div class="status-bar-simple"></div>
    <div data-eb="nav-header" data-title="내 용어장" data-back="mypage.html" data-right="text" data-right-label="편집"></div>

    <div class="section-white">
      <div class="hero-card">
        <div class="hero-icon"><img src="assets/img/glossary-hero-illust.png" alt="" /></div>
        <div class="hero-text">
          <div>
            <div class="hero-label">저장된 용어</div>
            <div class="hero-count" id="term-count">0개</div>
          </div>
          <div class="hero-sub">나만의 경제 용어장을 만들어보세요.</div>
        </div>
      </div>
    </div>

    <div class="section-white" style="padding-top:0;">
      <div class="filter-row">
        <button type="button" class="filter-item"><span>카테고리</span><span class="gicon" role="img" aria-label="">folder</span></button>
        <button type="button" class="filter-item"><span>최근 추가순</span><span class="gicon" role="img" aria-label="">sync_alt</span></button>
      </div>
      <div class="term-list" id="term-list"></div>
      <div class="empty-state" id="empty-state" style="display:none;">아직 저장한 용어가 없어요.<br />기사 속 밑줄 친 용어를 눌러 저장해보세요.</div>
    </div>

  </div>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/common.js"></script>
<script>
  var editing = false;
  var listEl = document.getElementById('term-list');
  var countEl = document.getElementById('term-count');

  function render() {
    var terms = EB.glossary.getAll();
    countEl.textContent = EB.glossary.count() + '개';
    document.getElementById('empty-state').style.display = terms.length ? 'none' : 'block';

    listEl.textContent = '';
    terms.forEach(function (t) {
      var item = document.createElement('div');
      item.className = 'term-item';
      var info = document.createElement('div');
      info.className = 'term-info';
      var copy = document.createElement('div');
      var name = document.createElement('div');
      name.className = 'term-name';
      name.textContent = t.term;
      var definition = document.createElement('div');
      definition.className = 'term-def';
      definition.textContent = t.definition;
      copy.append(name, definition);
      var meta = document.createElement('div');
      meta.className = 'term-meta';
      var category = document.createElement('span');
      category.className = 'term-tag';
      category.textContent = t.category;
      var date = document.createElement('span');
      date.className = 'term-date';
      date.textContent = t.date + ' 추가';
      meta.append(category, date);
      info.append(copy, meta);
      var actions = document.createElement('div');
      actions.className = 'term-actions';
      var bookmark = document.createElement('button');
      bookmark.type = 'button';
      bookmark.className = 'bookmark-btn';
      var bookmarkIcon = document.createElement('span');
      bookmarkIcon.className = 'gicon';
      bookmarkIcon.setAttribute('role', 'img');
      bookmarkIcon.setAttribute('aria-label', '저장됨');
      bookmarkIcon.textContent = 'bookmark';
      bookmark.appendChild(bookmarkIcon);
      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'delete-btn';
      remove.dataset.term = t.term;
      remove.textContent = '×';
      actions.append(bookmark, remove);
      item.append(info, actions);
      listEl.appendChild(item);
    });

    listEl.querySelectorAll('.delete-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        EB.glossary.remove(btn.getAttribute('data-term'));
        render();
      });
    });
  }

  render();

  // the nav-header "편집" button is injected by common.js on DOMContentLoaded,
  // so wire it up right after that (setTimeout 0 runs after all DOMContentLoaded listeners)
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      var navEditBtn = document.querySelector('.nav-header-common .nav-text-btn');
      if (!navEditBtn) return;
      navEditBtn.addEventListener('click', function () {
        editing = !editing;
        navEditBtn.textContent = editing ? '완료' : '편집';
        listEl.classList.toggle('editing', editing);
      });
    }, 0);
  });
</script>

</body>
</html>
